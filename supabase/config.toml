# Supabase Configuration File
# For local development and deployment

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Email auth for staff only
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:19000", "http://localhost:3001/auth/callback"]
jwt_expiry = 3600
enable_signup = false # Only admins can create staff accounts
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MB"

[storage.buckets.menu-images]
public = true
file_size_limit = "5MB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.qr-codes]
public = true
file_size_limit = "1MB"
allowed_mime_types = ["image/png"]

[storage.buckets.branding]
public = true
file_size_limit = "2MB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/svg+xml"]

