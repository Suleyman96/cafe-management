appId: com.gustri.app
---
- launchApp
# Login
- tapOn: "Email address"
- inputText: "admin@test.com"
- tapOn: "Password"
- inputText: "test1234"
- tapOn:
    text: "Sign in"
- assertVisible:
    text: "Tables|Orders"
    timeout: 15000

# Navigate to calls tab
- tapOn: "Calls"
- assertVisible:
    text: "Calls"
    timeout: 10000
