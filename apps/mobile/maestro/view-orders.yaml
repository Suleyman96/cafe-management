appId: com.gustri.app
---
- launchApp
# Login
- tapOn: "Email address"
- inputText: "admin@test.com"
- tapOn: "Password"
- inputText: "test1234"
- tapOn:
    text: "Sign in"
- assertVisible:
    text: "Tables|Orders"
    timeout: 15000

# Navigate to orders tab
- tapOn: "Orders"
- assertVisible:
    text: "Orders"
    timeout: 10000

# Guard against the historical regression where Metro served two copies of
# @tanstack/react-query and screens crashed with "No QueryClient set". The
# manual dedup workaround in metro.config.js exists to prevent this — if it
# ever regresses, this assertion fails first.
- assertNotVisible: "No QueryClient set"
