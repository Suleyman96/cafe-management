name: Deploy Staff Web

on:
  # Chained behind "Deploy Migrations" (not CI directly) so the Vercel
  # deploy can never ship app code that depends on schema the prod DB
  # hasn't received yet. If migrations fail, this workflow is skipped
  # via the `workflow_run.conclusion == 'success'` gate below.
  workflow_run:
    workflows: [Deploy Migrations]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staff-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAFF_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Stamp commit SHA into staff-web
        # `vercel build` sandboxes its env and strips host vars, so the
        # postbuild SW-version-injection script reads the SHA from a file
        # inside rootDirectory instead. See apps/staff-web/scripts/inject-sw-version.mjs.
        run: echo "${{ github.sha }}" > apps/staff-web/.commit-sha

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
