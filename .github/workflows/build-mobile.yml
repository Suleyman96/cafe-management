name: Build Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'packages/database/**'
      - 'packages/api-client/**'
      - 'packages/queries/**'
      - 'packages/i18n/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'packages/database/**'
      - 'packages/api-client/**'
      - 'packages/queries/**'
      - 'packages/i18n/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: EAS Build (Preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # The post-build step writes a comment on the PR with the EAS build URL.
    # Default GITHUB_TOKEN is read-only for issues/PRs, so the github-script
    # call returned 403 "Resource not accessible by integration" until these
    # were granted. `contents: read` keeps `actions/checkout` working.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        id: eas-build
        working-directory: apps/mobile
        run: |
          # `--json` writes JSON to stdout; progress + warnings ("No environment
          # variables…", "Created update channel…") go to stderr. Capture stdout
          # only — mixing them feeds non-JSON to jq and the parser explodes on
          # the leading "✔ …" lines.
          set -o pipefail
          BUILD_OUTPUT=$(eas build --profile preview --platform android --non-interactive --no-wait --json)
          echo "$BUILD_OUTPUT"

          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id // empty')
          OWNER=$(echo "$BUILD_OUTPUT" | jq -r '.[0].project.ownerAccount.name // empty')
          SLUG=$(echo "$BUILD_OUTPUT"  | jq -r '.[0].project.slug // empty')
          if [ -n "$BUILD_ID" ] && [ -n "$OWNER" ] && [ -n "$SLUG" ]; then
            BUILD_URL="https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$BUILD_ID"
          else
            BUILD_URL=""
          fi
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Comment build URL on PR
        # Skip on fork PRs (token is read-only regardless of permissions block).
        if: steps.eas-build.outputs.build_url != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📱 **EAS Preview Build started**\n\n[View build details](${process.env.BUILD_URL})\n\nProfile: \`preview\` | Platform: Android (APK)`
            })
        env:
          BUILD_URL: ${{ steps.eas-build.outputs.build_url }}

  build-production:
    name: EAS Build (Production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production
        working-directory: apps/mobile
        run: eas build --profile production --platform android --non-interactive --no-wait --auto-submit

  publish-ota:
    name: Publish OTA Update (Production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        working-directory: apps/mobile
        run: eas update --channel production --auto --non-interactive

  smoke-test:
    name: Maestro Smoke Test
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Maestro needs an app installed and a simulator running. The app
      # binary is expected to come from a preceding EAS preview build —
      # download is wired manually for now since EAS build artifacts aren't
      # exposed to GitHub Actions by default.
      - name: Run smoke flows
        run: maestro test apps/mobile/maestro/
