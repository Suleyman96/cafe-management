name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install & Build Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Save workspace cache
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Biome check
        run: pnpm check

      - name: Scan for secrets
        run: |
          FOUND=0
          PATTERNS=(
            'SUPABASE_SERVICE_ROLE_KEY\s*='
            'SENTRY_AUTH_TOKEN\s*='
            'UPSTASH_REDIS_REST_TOKEN\s*='
            'PII_ENCRYPTION_KEY\s*='
            'sk_live_[a-zA-Z0-9]+'
            'AKIA[0-9A-Z]{16}'
          )
          SKIP='\.env|node_modules|\.secrets\.baseline|\.husky/pre-commit|ARCHITECTURE_REVIEW\.md|ci\.yml'
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rEn "$PATTERN" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' . | grep -vE "$SKIP" || true)
            if [ -n "$MATCHES" ]; then
              echo "🚨 Potential secret pattern found: $PATTERN"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Secret scan failed. Review the matches above."
            exit 1
          fi
          echo "✅ No secrets detected."

      - name: Audit dependencies
        run: pnpm audit --prod || true

      - name: i18n — no hardcoded toast / Alert literals
        # Every user-visible string must go through `t(...)`. This catches
        # `toast.error('literal')`, `toast.success('literal')`, etc., as well
        # as React Native `Alert.alert('literal', ...)`. Variables (`toast.error(msg)`)
        # are allowed — assumed to come from `t(...)` upstream.
        run: |
          set +e
          OUTPUT=$(grep -rEn "toast\.(error|success|info|warning|message)\(['\"]|Alert\.alert\(['\"]" \
            apps/staff-web/src \
            apps/customer-web/src \
            apps/mobile/src \
            --include='*.ts' --include='*.tsx' 2>/dev/null)
          if [ -n "$OUTPUT" ]; then
            echo "❌ Hardcoded user-facing string — wrap in t(...) from @gustri/i18n:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ No hardcoded toast/Alert literals."

      - name: Wrapper boundary — no raw .from()/.rpc() in app hooks/components
        # Wrappers in @gustri/api-client are the only data-access path.
        # API routes (apps/*/app/api/**) and lib/services/** are server-side
        # exceptions documented in CLAUDE.md (Exception 2).
        # Realtime fallback polling in notification-provider is annotated
        # `Raw queries intentional` and grandfathered via the regex below.
        run: |
          set +e
          OUTPUT=$(grep -rEn "supabase\.from\(|supabase\.rpc\(" \
            apps/staff-web/src/hooks \
            apps/staff-web/src/components \
            apps/customer-web/src/hooks \
            apps/customer-web/src/components \
            apps/mobile/src/hooks \
            apps/mobile/src/components \
            --include='*.ts' --include='*.tsx' 2>/dev/null \
            | grep -vE "supabase\.storage" \
            | grep -vE "Raw queries intentional")
          if [ -n "$OUTPUT" ]; then
            echo "❌ Wrapper boundary violation — use db.* from @gustri/api-client:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ No raw .from()/.rpc() outside the wrapper."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Run tests with coverage
        run: pnpm test:coverage

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Type check
        run: pnpm type-check --filter='./apps/*'

      - name: Build apps
        run: pnpm build --filter=@gustri/staff-web --filter=@gustri/customer-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  peer-deps-check:
    name: Verify React peers accept v18 + v19
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify React peers accept 19
        run: |
          FAIL=0
          for pkg in queries i18n ui; do
            file="packages/$pkg/package.json"
            if [ ! -f "$file" ]; then
              echo "::warning::$file not found, skipping"
              continue
            fi
            peer=$(jq -r '.peerDependencies.react // "missing"' "$file")
            if [[ ! "$peer" == *"19"* ]]; then
              echo "::error::packages/$pkg missing React 19 in peer range: $peer"
              FAIL=1
            else
              echo "✅ packages/$pkg react peer: $peer"
            fi
          done
          exit $FAIL

  mobile-check:
    name: Mobile Type Check & Test
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Lint
        run: pnpm lint --filter=@gustri/mobile

      - name: Type check
        run: pnpm type-check --filter=@gustri/mobile

      - name: Run mobile tests
        run: pnpm vitest run --config apps/mobile/vitest.config.ts

  db-types-check:
    name: DB Types Drift Check
    runs-on: ubuntu-latest
    needs: [setup]
    # Only run when migrations or types were touched.
    if: ${{ contains(github.event.pull_request.changed_files, 'supabase/migrations/') || contains(github.event.pull_request.changed_files, 'packages/database/src/types/') || github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Verify generated types match schema
        run: ./scripts/generate-types.sh --check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Create admin user
        run: ./scripts/create-admin-user.sh

      - name: Write env files
        run: |
          cat > apps/staff-web/.env.local << 'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_CUSTOMER_WEB_URL=http://localhost:3000
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ENVEOF
          cat > apps/customer-web/.env.local << 'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
          ENVEOF

      - name: Verify env files
        run: |
          grep -q '^NEXT_PUBLIC_SUPABASE_URL=' apps/staff-web/.env.local || (echo "FAIL: staff-web env vars have leading whitespace" && exit 1)
          grep -q '^NEXT_PUBLIC_SUPABASE_URL=' apps/customer-web/.env.local || (echo "FAIL: customer-web env vars have leading whitespace" && exit 1)

      - name: Run RLS policy tests
        run: pnpm test:rls

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run staff-web E2E tests
        run: cd apps/staff-web && npx playwright test
        env:
          CI: true

      - name: Run customer-web E2E tests
        run: cd apps/customer-web && npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/staff-web/playwright-report/
            apps/customer-web/playwright-report/
          retention-days: 7
