name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install & Build Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Save workspace cache
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Biome check
        run: pnpm check

      - name: Scan for secrets
        run: |
          FOUND=0
          PATTERNS=(
            'SUPABASE_SERVICE_ROLE_KEY\s*='
            'SENTRY_AUTH_TOKEN\s*='
            'UPSTASH_REDIS_REST_TOKEN\s*='
            'PII_ENCRYPTION_KEY\s*='
            'sk_live_[a-zA-Z0-9]+'
            'AKIA[0-9A-Z]{16}'
          )
          SKIP='\.env|node_modules|\.secrets\.baseline|\.husky/pre-commit|ARCHITECTURE_REVIEW\.md|ci\.yml'
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rEn "$PATTERN" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' . | grep -vE "$SKIP" || true)
            if [ -n "$MATCHES" ]; then
              echo "🚨 Potential secret pattern found: $PATTERN"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Secret scan failed. Review the matches above."
            exit 1
          fi
          echo "✅ No secrets detected."

      - name: Audit dependencies
        run: pnpm audit --prod || true

      - name: i18n — no hardcoded toast / Alert literals
        # Every user-visible string must go through `t(...)`. This catches
        # `toast.error('literal')`, `toast.success('literal')`, etc., as well
        # as React Native `Alert.alert('literal', ...)`. Variables (`toast.error(msg)`)
        # are allowed — assumed to come from `t(...)` upstream.
        run: |
          set +e
          OUTPUT=$(grep -rEn "toast\.(error|success|info|warning|message)\(['\"]|Alert\.alert\(['\"]" \
            apps/staff-web/src \
            apps/customer-web/src \
            apps/mobile/src \
            --include='*.ts' --include='*.tsx' 2>/dev/null)
          if [ -n "$OUTPUT" ]; then
            echo "❌ Hardcoded user-facing string — wrap in t(...) from @gustri/i18n:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ No hardcoded toast/Alert literals."

      - name: Wrapper boundary — no raw .from()/.rpc() in app hooks/components
        # Wrappers in @gustri/api-client are the only data-access path.
        # API routes (apps/*/app/api/**) and lib/services/** are server-side
        # exceptions documented in CLAUDE.md (Exception 2).
        # Realtime fallback polling in notification-provider is annotated
        # `Raw queries intentional` and grandfathered via the regex below.
        run: |
          set +e
          OUTPUT=$(grep -rEn "supabase\.from\(|supabase\.rpc\(" \
            apps/staff-web/src/hooks \
            apps/staff-web/src/components \
            apps/customer-web/src/hooks \
            apps/customer-web/src/components \
            apps/mobile/src/hooks \
            apps/mobile/src/components \
            --include='*.ts' --include='*.tsx' 2>/dev/null \
            | grep -vE "supabase\.storage" \
            | grep -vE "Raw queries intentional")
          if [ -n "$OUTPUT" ]; then
            echo "❌ Wrapper boundary violation — use db.* from @gustri/api-client:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ No raw .from()/.rpc() outside the wrapper."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Run tests with coverage
        run: pnpm test:coverage

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      # The restored workspace cache provides built package dist/ outputs, but
      # pnpm's symlinked node_modules store does not round-trip reliably through
      # actions/cache — `next build` (webpack) can fail to resolve a dependency
      # that tsc still sees (observed: @bprogress/next in customer-web). Reinstall
      # to materialize a correct node_modules; the pnpm store cache keeps it fast
      # and the restored packages/*/dist is left untouched.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check --filter='./apps/*'

      - name: Build apps
        # marketing is gated here too: its `next build` (webpack/MDX/RSC) was
        # previously never run in CI, so a broken marketing build could land on
        # main undetected. It needs no Supabase env (static marketing + blog).
        run: pnpm build --filter=@gustri/staff-web --filter=@gustri/customer-web --filter=@gustri/marketing
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # customer-web's next.config.js hard-fails a production build if this
          # is unset (the H5 build-time guard). The real value is injected by
          # Vercel at deploy time; this CI step only compiles + runs the
          # bundle-size guardrail, so a placeholder (overridable by a secret)
          # is sufficient to satisfy the guard.
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://staff-web.example.com' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # P9 — customer-web is the cold-load surface; gate against silent
      # bundle regressions. Compares per-route first-load JS bytes
      # against the committed baseline; fails on >10 kB regression per
      # route or any route exceeding the 200 kB hard ceiling. Update via
      # `pnpm --filter @gustri/customer-web bundle-baseline` and commit
      # in the same PR as the intended size increase.
      - name: Bundle-size guardrail (customer-web)
        run: pnpm --filter @gustri/customer-web bundle-check

  peer-deps-check:
    name: Verify React peers accept v18 + v19
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify React peers accept 19
        run: |
          FAIL=0
          # The React-bearing shared packages. Previously this listed `ui`,
          # which has no package.json (the real component packages are
          # `ui-web` / `ui-mobile`) — so the check silently skipped and never
          # validated the packages that actually declare React peers.
          for pkg in queries i18n ui-web ui-mobile; do
            file="packages/$pkg/package.json"
            if [ ! -f "$file" ]; then
              echo "::error::$file not found"
              FAIL=1
              continue
            fi
            react=$(jq -r '.peerDependencies.react // "missing"' "$file")
            if [[ ! "$react" == *"19"* ]]; then
              echo "::error::packages/$pkg missing React 19 in react peer range: $react"
              FAIL=1
            else
              echo "✅ packages/$pkg react peer: $react"
            fi
            # react-dom is optional (only web component packages declare it).
            # When present it must also accept 19, or the React-19 web
            # migration hits a peer conflict the react-only check wouldn't see.
            rdom=$(jq -r '.peerDependencies["react-dom"] // "none"' "$file")
            if [[ "$rdom" != "none" && ! "$rdom" == *"19"* ]]; then
              echo "::error::packages/$pkg react-dom peer doesn't accept 19: $rdom"
              FAIL=1
            elif [[ "$rdom" != "none" ]]; then
              echo "✅ packages/$pkg react-dom peer: $rdom"
            fi
          done
          exit $FAIL

  mobile-check:
    name: Mobile Type Check & Test
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Lint
        run: pnpm lint --filter=@gustri/mobile

      - name: Type check
        run: pnpm type-check --filter=@gustri/mobile

      - name: Run mobile tests
        run: pnpm vitest run --config apps/mobile/vitest.config.ts

  db-types-check:
    name: DB Types Drift Check
    runs-on: ubuntu-latest
    needs: [setup]
    # Always run. The previous conditional used
    # `contains(github.event.pull_request.changed_files, 'supabase/migrations/')`
    # but `pull_request.changed_files` is an integer (file count), not a path
    # list — so `contains(<int>, '<string>')` always evaluated false and the
    # gate silently skipped on every PR. That mask let `current_tenant_id_text`
    # drift sit on main undetected for a week. Cost of always running is
    # ~30-60s; cost of a wrong gate is shipping a drifted schema.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned. `latest` made drift detection non-deterministic — newer
          # CLI versions apply newer Supabase Storage extension migrations
          # (e.g., adding `metadata` to storage.s3_multipart_uploads, the
          # `allow_*_operation` helpers) which silently inflate the
          # generated types diff and turn green PRs red without any code
          # change.
          #
          # Bump this version deliberately and regenerate types in the
          # same PR. Match it locally with: `npx supabase@<ver> start`.
          version: 2.78.1

      - name: Start Supabase
        run: supabase start

      - name: Verify generated types match schema
        run: ./scripts/generate-types.sh --check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: workspace-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned. `latest` made drift detection non-deterministic — newer
          # CLI versions apply newer Supabase Storage extension migrations
          # (e.g., adding `metadata` to storage.s3_multipart_uploads, the
          # `allow_*_operation` helpers) which silently inflate the
          # generated types diff and turn green PRs red without any code
          # change.
          #
          # Bump this version deliberately and regenerate types in the
          # same PR. Match it locally with: `npx supabase@<ver> start`.
          version: 2.78.1

      - name: Start Supabase
        run: supabase start

      - name: Create admin user
        run: ./scripts/create-admin-user.sh

      - name: Write env files
        run: |
          cat > apps/staff-web/.env.local << 'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_CUSTOMER_WEB_URL=http://localhost:3000
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ENVEOF
          cat > apps/customer-web/.env.local << 'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
          ENVEOF

      - name: Verify env files
        run: |
          grep -q '^NEXT_PUBLIC_SUPABASE_URL=' apps/staff-web/.env.local || (echo "FAIL: staff-web env vars have leading whitespace" && exit 1)
          grep -q '^NEXT_PUBLIC_SUPABASE_URL=' apps/customer-web/.env.local || (echo "FAIL: customer-web env vars have leading whitespace" && exit 1)

      - name: Run RLS policy tests
        run: pnpm test:rls

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run staff-web E2E tests
        run: cd apps/staff-web && npx playwright test
        env:
          CI: true

      - name: Run customer-web E2E tests
        run: cd apps/customer-web && npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/staff-web/playwright-report/
            apps/customer-web/playwright-report/
          retention-days: 7
