name: Deploy Marketing

# Manual-trigger only for now. Marketing was the one app with no deploy path;
# this defines it, mirroring deploy-staff-web / deploy-customer-web. It stays
# `workflow_dispatch`-only so it can't auto-fail on every main push before the
# Vercel project + `VERCEL_MARKETING_PROJECT_ID` secret exist.
#
# To enable automatic deploys once the Vercel project is configured, add the
# trigger the sibling apps use:
#   workflow_run:
#     workflows: [Deploy Migrations]
#     types: [completed]
#     branches: [main]
# Marketing has no DB dependency (static site + MDX blog), so chaining behind
# migrations isn't strictly required — `push: branches: [main]` would also be
# fine — but matching the siblings keeps one deploy convention.
on:
  workflow_dispatch:

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
