name: Deploy Marketing

# Auto-deploys on every push to main, plus manual dispatch. Marketing is a
# static site + MDX blog with NO DB dependency, so (unlike deploy-staff-web /
# deploy-customer-web, which chain behind Deploy Migrations via `workflow_run`)
# it deploys directly on push — no need to gate on migrations.
#
# PREREQUISITE: this requires the `VERCEL_MARKETING_PROJECT_ID` secret and a
# configured Vercel project. Until both exist, `vercel pull` fails and every
# main push goes red — so this trigger must only be live once the project +
# secret are in place. (`VERCEL_ORG_ID` / `VERCEL_TOKEN` already exist, reused
# from the sibling deploy workflows.)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
