name: Data Retention

# GDPR/PII retention sweep. Invokes the purpose-built
# `POST /api/v1/admin/retention` endpoint (which runs the `run_data_retention`
# RPC: archive-prune aged rows + anonymize expired PII). Previously this had no
# automated schedule — retention depended on someone running it by hand.
#
# Required configuration (repo Secrets) to actually run:
#   - RETENTION_ENDPOINT_URL  → https://<staff-web-prod-host>/api/v1/admin/retention
#   - RETENTION_CRON_SECRET   → a strong random secret, ALSO set as the
#                               `CRON_SECRET` env var on the staff-web
#                               deployment (Vercel). The endpoint authorizes the
#                               cron via the `x-cron-secret` header.
# Until both are set the job no-ops with a warning (no red runs).

on:
  schedule:
    # Daily at 03:17 UTC — off the top of the hour to dodge the cron stampede.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: data-retention
  cancel-in-progress: false

jobs:
  run-retention:
    name: Run data-retention sweep
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "${{ secrets.RETENTION_ENDPOINT_URL }}" ] || [ -z "${{ secrets.RETENTION_CRON_SECRET }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RETENTION_ENDPOINT_URL / RETENTION_CRON_SECRET not set — skipping. Configure both (and CRON_SECRET on the deployment) to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger retention endpoint
        if: steps.cfg.outputs.configured == 'true'
        run: |
          code=$(curl -sS -o /tmp/retention-resp.json -w '%{http_code}' \
            --max-time 120 \
            -X POST "${{ secrets.RETENTION_ENDPOINT_URL }}" \
            -H "x-cron-secret: ${{ secrets.RETENTION_CRON_SECRET }}" \
            -H 'content-type: application/json')
          echo "HTTP $code"
          cat /tmp/retention-resp.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Data retention failed (HTTP $code)"
            exit 1
          fi
          echo "✅ Data retention completed."
